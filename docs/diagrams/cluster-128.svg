<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="780" viewBox="0 0 1040 780" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
<title>Reference design — 128-node BCM + Run:ai GPU cluster</title>
<rect width="1040" height="780" fill="#ffffff" rx="8"/>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#64748b"/></marker></defs>
<text x="24" y="34" font-size="20" font-weight="700" fill="#1e293b">Reference design — 128-node BCM + Run:ai GPU cluster</text>
<text x="24" y="56" font-size="12" fill="#64748b">Reference design at 128-node scale. Values are parameterized in 00-variables.sh, whose shipped defaults describe the lab build (3 GPU workers).</text>
<rect x="140" y="80" width="300" height="64" rx="8" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<text x="290.0" y="105.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">BCM head node — 1× VM</text>
<text x="290.0" y="122.5" font-size="11" fill="#e9e4ff" text-anchor="middle">★ standard · Proxmox hypervisor failover</text>
<line x1="290" y1="144" x2="290" y2="246" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="300" y="200" font-size="11" fill="#64748b">provisions over internalnet</text>
<rect x="600" y="80" width="300" height="64" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="750.0" y="102.5" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">External Pure NFS server</text>
<text x="750.0" y="119.5" font-size="11" fill="#64748b" text-anchor="middle">on storagenet · $NFS_SERVER:$NFS_SHARE</text>
<text x="750.0" y="134.5" font-size="11" fill="#64748b" text-anchor="middle">mounted per section 07 (not served by the head node)</text>
<line x1="750" y1="144" x2="750" y2="294" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="40" y="246" width="960" height="40" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
<text x="60" y="271" font-size="13" font-weight="700" fill="#1e293b">internalnet</text>
<text x="300" y="271" font-size="12" fill="#64748b">$NET_PROVISION — BCM provisioning (PXE/DHCP) · cluster management</text>
<rect x="40" y="294" width="960" height="40" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
<text x="60" y="319" font-size="13" font-weight="700" fill="#1e293b">storagenet</text>
<text x="300" y="319" font-size="12" fill="#64748b">$NET_STORAGE — Pure NFS storage</text>
<rect x="40" y="342" width="960" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
<text x="60" y="367" font-size="13" font-weight="700" fill="#1e293b">usernet</text>
<text x="300" y="367" font-size="12" fill="#64748b">$NET_USER — service / user access (MetalLB, ingress, Run:ai endpoints)</text>
<rect x="40" y="390" width="960" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
<text x="60" y="415" font-size="13" font-weight="700" fill="#1e293b">mgmtnet</text>
<text x="300" y="415" font-size="12" fill="#64748b">$NET_OOB — OOB / BMC (IPMI) — not provisioning</text>
<rect x="40" y="438" width="960" height="40" rx="6" fill="#fae8ff" stroke="#a855f7" stroke-width="1"/>
<text x="60" y="463" font-size="13" font-weight="700" fill="#1e293b">InfiniBand fabric</text>
<text x="300" y="463" font-size="12" fill="#64748b">GPU east-west — per the site BOM (section 16; not a variable) · rate per device class</text>
