<rect x="530" y="510" width="225" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="642.5" y="541.0" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">65–96</text>
<text x="642.5" y="558.0" font-size="11" fill="#64748b" text-anchor="middle">32× GPU workers</text>
<text x="642.5" y="575.0" font-size="11" fill="#64748b" text-anchor="middle">B300 DGX nodes</text>
<line x1="642" y1="478" x2="642" y2="510" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,3"/>
<rect x="775" y="510" width="225" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="887.5" y="541.0" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">97–128</text>
<text x="887.5" y="558.0" font-size="11" fill="#64748b" text-anchor="middle">32× GPU workers</text>
<text x="887.5" y="575.0" font-size="11" fill="#64748b" text-anchor="middle">B300 DGX nodes</text>
<line x1="887" y1="478" x2="887" y2="510" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="520" y="632" font-size="12" fill="#64748b" text-anchor="middle">128 workers at reference scale — size $GPU_WORKERS / $GPU_WORKER_IPS to the site · one category + software image per GPU node type</text>
<rect x="40" y="652" width="960" height="56" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
<text x="520.0" y="673.5" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">Kubernetes + Run:ai — on the GPU workers</text>
<text x="520.0" y="690.5" font-size="11" fill="#64748b" text-anchor="middle">14 operators · gateway · GPU burn-in + dgx-vitals verdicts (section 08)</text>
<text x="24" y="740" font-size="11" fill="#64748b">Network names and purposes follow section 01; storage follows section 07. Link speeds are site BOM facts, not template values.</text>
